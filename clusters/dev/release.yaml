apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: gitops-lab
  namespace: flux-system
spec:
  interval: 1m
  url: https://github.com/dubercode/gitops-flux-fleet
  ref:
    branch: main
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: app-dev
  namespace: flux-system
spec:
  interval: 1m
  retryInterval: 10s
  targetNamespace: demo-app
  sourceRef:
    kind: GitRepository
    name: gitops-lab
  path: ./apps/base
  prune: true