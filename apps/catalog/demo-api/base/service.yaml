apiVersion: v1
kind: Service
metadata:
  name: demo-api-svc
  namespace: demo-api
  labels:
    app.kubernetes.io/name: demo-api
    app.kubernetes.io/component: api
spec:
  type: ClusterIP

  selector:
    app.kubernetes.io/name: demo-api

  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: http
