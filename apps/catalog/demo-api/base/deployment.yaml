apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-api
  namespace: demo-api
  labels:
    app.kubernetes.io/name: demo-api
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: gitops-flux-fleet
spec:
  replicas: 2

  selector:
    matchLabels:
      app.kubernetes.io/name: demo-api

  template:
    metadata:
      labels:
        app.kubernetes.io/name: demo-api
        app.kubernetes.io/component: api

    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: http-echo
          image: hashicorp/http-echo:1.0.0
          imagePullPolicy: IfNotPresent

          args:
            - "-text=Hello from demo-api managed by Flux!"

          ports:
            - name: http
              containerPort: 5678
              protocol: TCP

          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 64Mi

          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5

          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10

          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
